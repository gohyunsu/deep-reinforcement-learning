<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" role="img" aria-labelledby="t d"><title id="t">GAE와 Proximal Policy Optimization 개념 흐름</title><desc id="d">rollout 수집 → GAE 계산 → 비율 $r_t$ → clipped update</desc><rect width="920" height="250" rx="20" fill="#f6f8f9"/><text x="36" y="48" fill="#17243a" font-size="18" font-weight="700">개념의 진행</text><path d="M215 135h28m-8 -8 8 8-8 8" fill="none" stroke="#98a6b5" stroke-width="3"/><path d="M435 135h28m-8 -8 8 8-8 8" fill="none" stroke="#98a6b5" stroke-width="3"/><path d="M655 135h28m-8 -8 8 8-8 8" fill="none" stroke="#98a6b5" stroke-width="3"/><g><rect x="35" y="92" width="180" height="86" rx="14" fill="#244f82"/><text x="125" y="143" text-anchor="middle" fill="white" font-size="17" font-weight="700">rollout 수집</text></g><g><rect x="255" y="92" width="180" height="86" rx="14" fill="#146d70"/><text x="345" y="143" text-anchor="middle" fill="white" font-size="17" font-weight="700">GAE 계산</text></g><g><rect x="475" y="92" width="180" height="86" rx="14" fill="#b46e29"/><text x="565" y="143" text-anchor="middle" fill="white" font-size="17" font-weight="700">비율 $r_t$</text></g><g><rect x="695" y="92" width="180" height="86" rx="14" fill="#244f82"/><text x="785" y="143" text-anchor="middle" fill="white" font-size="17" font-weight="700">clipped update</text></g><text x="36" y="222" fill="#5e6d80" font-size="13">앞 단계의 데이터와 추정이 다음 업데이트의 입력이 된다.</text></svg>