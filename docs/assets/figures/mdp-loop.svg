<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-labelledby="t d">
  <title id="t">MDP의 한 단계</title><desc id="d">상태에서 정책이 행동을 고르고 환경이 보상과 다음 상태를 돌려준다.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#286f72"/></marker></defs>
  <rect x="24" y="74" width="155" height="74" rx="12" fill="#eaf0f7" stroke="#8ea9c1"/>
  <text x="101" y="106" text-anchor="middle" font-size="19" font-weight="700" fill="#17243a">현재 상태</text>
  <text x="101" y="132" text-anchor="middle" font-size="17" fill="#356185">s<tspan baseline-shift="sub" font-size="12">t</tspan></text>
  <rect x="299" y="74" width="155" height="74" rx="12" fill="#e6f1f0" stroke="#81b6b3"/>
  <text x="376" y="106" text-anchor="middle" font-size="19" font-weight="700" fill="#17243a">정책의 행동</text>
  <text x="376" y="132" text-anchor="middle" font-size="17" fill="#146d70">a<tspan baseline-shift="sub" font-size="12">t</tspan> ~ π(· | s<tspan baseline-shift="sub" font-size="12">t</tspan>)</text>
  <rect x="574" y="74" width="160" height="74" rx="12" fill="#fbf0e1" stroke="#d0a169"/>
  <text x="654" y="106" text-anchor="middle" font-size="19" font-weight="700" fill="#17243a">환경 전이</text>
  <text x="654" y="132" text-anchor="middle" font-size="16" fill="#a36324">p(s' | s, a)</text>
  <path d="M180 111H291M455 111H565" fill="none" stroke="#286f72" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M654 150V194H102V150" fill="none" stroke="#286f72" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="379" y="188" text-anchor="middle" font-size="17" fill="#34576e">보상 r<tspan baseline-shift="sub" font-size="12">t</tspan> · 다음 상태 s<tspan baseline-shift="sub" font-size="12">t+1</tspan></text>
</svg>
